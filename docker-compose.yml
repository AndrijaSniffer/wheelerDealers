services:
  # --- DATABASE SERVICE (MySQL) ---
  db:
    image: mysql:8.0
    restart: always
    # CRITICAL: Forces MySQL to allow root connections from other containers
    command: --default-authentication-plugin=mysql_native_password --host-cache-size=0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_HOST=%
    ports:
      - "3306:3306"

  # --- DJANGO BACKEND ---
  backend:
    build: ./srv
    volumes:
      - ./srv:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    command: |
      python3 -c "
      import socket, time, os
      print('Checking MySQL availability...')
      while True:
          try:
              s = socket.create_connection(('db', 3306), timeout=1)
              s.close()
              print('MySQL is fully awake! Running migrations...')
              break
          except Exception:
              time.sleep(1)
      time.sleep(10)
      os.system('python manage.py migrate')
      os.system('python manage.py runserver 0.0.0.0:8000')
      "
    depends_on:
      - db

  # --- FRONTEND (ANGULAR) SERVICE ---
  frontend:
    build: ./web
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  mysql_data:

