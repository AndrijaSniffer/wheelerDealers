<mat-toolbar color="primary" role="heading">
  <div *ngIf="!isSuperuser && (isLoggedIn || !isLoggedIn)">
    <button (click)="goToHome()" mat-button>Home</button>
    <button (click)="goToSearch()" mat-button>Search</button>
    <button (click)="goToContact()" mat-button>Contact us</button>
    <button *ngIf="isLoggedIn" (click)="temporaryCarAdd()" mat-raised-button>Add car</button>
  </div>
  <div *ngIf="isSuperuser && isLoggedIn">
    <button (click)="adminNavigate('countryManagement')" mat-button>Countries</button>
    <button (click)="adminNavigate('engineTypeManagement')" mat-button>Engine types</button>
    <button (click)="adminNavigate('emissionClassManagement')" mat-button>Emission classes</button>
    <button (click)="adminNavigate('modelTypeManagement')" mat-button>Model types</button>
    <button (click)="adminNavigate('transmissionManagement')" mat-button>Transmissions</button>
    <button (click)="adminNavigate('fuelManagement')" mat-button>Fuels</button>
    <button (click)="adminNavigate('interiorManagement')" mat-button>Interiors</button>
    <button (click)="adminNavigate('drivetrainManagement')" mat-button>Drivetrains</button>
    <button (click)="adminNavigate('manufacturerManagement')" mat-button>Manufacturers</button>
    <button (click)="adminNavigate('engineManagement')" mat-button>Engines</button>
    <button (click)="adminNavigate('modelManagement')" mat-button>Models</button>
    <button (click)="adminNavigate('carManagement')" mat-button>Cars</button>
    <button (click)="adminNavigate('userManagement')" mat-button>Users</button>
  </div>
  <span class="spacer"></span>
  <div *ngIf="!isLoggedIn">
    <button (click)="openLoginDialog()" mat-button>Login</button>
    <button (click)="openSignUpDialog()" mat-button>Sign up</button>
  </div>
  <div *ngIf="isLoggedIn">
    <span>Hello {{ username }} !</span>
    <button (click)="logout()" mat-button>Logout</button>
  </div>
</mat-toolbar>
