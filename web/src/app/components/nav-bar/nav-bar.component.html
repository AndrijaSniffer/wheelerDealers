<mat-toolbar role="heading" color="primary">
  <div *ngIf="!isSuperuser && (isLoggedIn || !isLoggedIn)">
  <button mat-button (click)="goToHome()">Home</button>
  <button mat-button (click)="goToSearch()">Search</button>
  <button mat-button (click)="goToContact()">Contact us</button>
  </div>
  <div *ngIf="isSuperuser && isLoggedIn">
    <button mat-button (click)="adminNavigate('countryManagement')">Countries</button>
    <button mat-button (click)="adminNavigate('engineTypeManagement')">Engine types</button>
    <button mat-button (click)="adminNavigate('emissionClassManagement')">Emission classes</button>
    <button mat-button (click)="adminNavigate('modelTypeManagement')">Model types</button>
    <button mat-button (click)="adminNavigate('transmissionManagement')">Transmissions</button>
    <button mat-button (click)="adminNavigate('fuelManagement')">Fuels</button>
    <button mat-button (click)="adminNavigate('interiorManagement')">Interiors</button>
    <button mat-button (click)="adminNavigate('drivetrainManagement')">Drivetrains</button>
    <button mat-button (click)="adminNavigate('manufacturerManagement')">Manufacturers</button>
    <button mat-button (click)="adminNavigate('engineManagement')">Engines</button>
    <button mat-button (click)="adminNavigate('modelManagement')">Models</button>
    <button mat-button (click)="adminNavigate('carManagement')">Cars</button>
    <button mat-button (click)="adminNavigate('userManagement')">Users</button>
  </div>
  <span class="spacer"></span>
  <div *ngIf="!isLoggedIn">
    <button mat-button (click)="openLoginDialog()">Login</button>
    <button mat-button (click)="openSignUpDialog()">Sign up</button>
  </div>
  <div *ngIf="isLoggedIn">
    <span>Hello {{ username }}!</span>
    <button mat-button (click)="logout()">Logout</button>
  </div>
</mat-toolbar>
