<mat-toolbar role="heading" color="primary">
  <div *ngIf="!isSuperuser && (isLoggedIn || !isLoggedIn)">
  <button mat-button (click)="goToHome()">Home</button>
  <button mat-button (click)="goToSearch()">Search</button>
  <button mat-button (click)="goToContact()">Contact us</button>
  </div>
  <div *ngIf="isSuperuser && isLoggedIn">
    <button mat-button (click)="adminNavigate('countryManagement')">Country</button>
    <button mat-button (click)="adminNavigate('engineTypeManagement')">Engine type</button>
    <button mat-button (click)="adminNavigate('emissionClassManagement')">Emission class</button>
    <button mat-button (click)="adminNavigate('modelTypeManagement')">Model type</button>
    <button mat-button (click)="adminNavigate('transmissionManagement')">Transmission</button>
    <button mat-button (click)="adminNavigate('fuelManagement')">Fuel</button>
    <button mat-button (click)="adminNavigate('interiorManagement')">Interior</button>
    <button mat-button (click)="adminNavigate('drivetrainManagement')">Drivetrain</button>
    <button mat-button (click)="adminNavigate('manufacturerManagement')">Manufacturer</button>
    <button mat-button (click)="adminNavigate('engineManagement')">Engine</button>
    <button mat-button (click)="adminNavigate('modelManagement')">Model</button>
  </div>
  <span class="spacer"></span>
  <div *ngIf="!isLoggedIn">
    <button mat-button (click)="openLoginDialog()">Login</button>
    <button mat-button (click)="openSignUpDialog()">Sign up</button>
  </div>
  <div *ngIf="isLoggedIn">
    <span>Hello {{ username }}!</span>
    <button mat-button (click)="logout()">Logout</button>
  </div>
</mat-toolbar>
