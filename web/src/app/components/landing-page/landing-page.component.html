<div class="wrap">
  <mat-toolbar class="toolbar" color="primary">
    <picture class="center-logo">
      <img class="logo" src="../../assets/images/logo.jpg">
    </picture>
    <div class="navigation-menu">
      <div matRipple class="navigation-menu-item" routerLinkActive="active-item"
           (click)="navigateToMain('home')">
        <mat-icon color="accent">home</mat-icon>
        <a class="link-item" routerLink="home" color="accent">Homepage</a>
      </div>

      <div matRipple class="navigation-menu-item" routerLinkActive="active-item"
           (click)="navigateToMain('search')">
        <mat-icon color="accent">search</mat-icon>
        <a class="link-item" routerLink="search" color="accent">Search</a>
      </div>

      <div matRipple class="navigation-menu-item" *ngIf="!isStaff" routerLinkActive="active-item"
           (click)="navigateToMain('contact')">
        <mat-icon color="accent">mail</mat-icon>
        <a class="link-item" routerLink="contact" color="accent">Contact us</a>
      </div>

    </div>
    <div class="login row">
      <p *ngIf="isAuth">Hello {{iuser.username}}!</p>
      <button mat-flat-button *ngIf="!isAuth" type="button" color="accent" (click)="navigateToLogin()">
        Login
      </button>
      <button mat-flat-button *ngIf="isAuth" type="button" color="accent" (click)="logout()">
        Logout
      </button>
    </div>
  </mat-toolbar>
  <div class="content-display">
    <div class="content-window">
      <router-outlet></router-outlet>
    </div>
  </div>
  <div class="footer">
    <div class="signed">
      <span>Andrija Cajic - 3711</span>
    </div>
  </div>
</div>
