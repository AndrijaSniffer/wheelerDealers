<div class="wrap">
    <mat-toolbar class="toolbar" color="primary">
        <picture class="center-logo">
            <img class="logo" src="../../assets/images/logo.jpg">
        </picture>
        &nbsp; &nbsp;

        <div class="navigation-wrap">
            <div class="navigation-menu">
                <div matRipple class="navigation-menu-item" routerLinkActive="active-item" (click)="navigateTo('home')">
                    <mat-icon color="accent">home</mat-icon>
                    <a class="link-item" routerLink="home" color="accent">Homepage</a>
                </div>
                <div matRipple class="navigation-menu-item" routerLinkActive="active-item" (click)="navigateTo('search')">
                    <mat-icon color="accent">search</mat-icon>
                    <a class="link-item" routerLink="search" color="accent">Search</a>
                </div>
                <div matRipple class="navigation-menu-item" routerLinkActive="active-item">
                    <mat-icon color="accent">star</mat-icon>
                    <a class="link-item" color="accent">Other</a>
                </div>
            </div>
        </div>
        &nbsp; &nbsp;

        <div>
            <button mat-flat-button type="button" color="accent" (click)="navigate()">
                Login
            </button>
        </div>
    </mat-toolbar>
    <div class="content-display">
        <div class="content-window">
            <router-outlet></router-outlet>
        </div>
    </div>
    <div class="footer">

    </div>
</div>
