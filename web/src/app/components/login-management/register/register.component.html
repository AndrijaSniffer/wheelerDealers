<div class="wrap">
    <picture class="center-logo">
        <img class="logo" src="../../../assets/images/logo.jpg">
    </picture>
    <div class="register-form">
        <ng-container *ngIf="!isLoading">
            <button mat-mini-fab type="button" color="accent" (click)="navigateBack()" class="space">
                <mat-icon>
                    arrow_back
                </mat-icon>
            </button>
            <h1>Welcome new user</h1>
            <form class="column" (ngSubmit)="submitForm()" [formGroup]="registerForm">
              <mat-form-field color="accent" appearance="outline">
                <mat-label>Enter your username</mat-label>
                <input matInput placeholder="Username..." formControlName="username">
              </mat-form-field>
                <mat-form-field color="accent" appearance="outline">
                    <mat-label>Enter your name</mat-label>
                    <input matInput placeholder="Name..." formControlName="name">
                </mat-form-field>
                <mat-form-field color="accent" appearance="outline">
                    <mat-label>Enter your surname</mat-label>
                    <input matInput placeholder="Surname..." formControlName="lastName">
                </mat-form-field>
                <mat-form-field color="accent" appearance="outline">
                    <mat-label>Enter your email</mat-label>
                    <input matInput placeholder="Email..." formControlName="email">
                </mat-form-field>
<!--                <mat-form-field color="accent" appearance="outline">-->
<!--                    <mat-label>Enter your phone number</mat-label>-->
<!--                    <input matInput placeholder="Phone..." formControlName="phone">-->
<!--                </mat-form-field>-->
                <mat-form-field color="accent" appearance="outline">
                    <mat-label>Enter your password</mat-label>
                    <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" placeholder="Password...">
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                  <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
                </mat-form-field>
                <mat-form-field color="accent" appearance="outline">
                    <mat-label>Confirm your password</mat-label>
                    <input matInput [type]="hideConfirm ? 'password' : 'text'" formControlName="confirmPassword" placeholder="Password...">
                    <button mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                  <mat-icon>{{hideConfirm ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
                    <mat-error>Password missmatch</mat-error>
                </mat-form-field>
                <button mat-flat-button color="accent" type="submit" [disabled]="registerForm.invalid">Register</button>
            </form>
        </ng-container>

        <mat-spinner *ngIf="isLoading" color="accent"></mat-spinner>
    </div>
</div>
