<h2 mat-dialog-title>Transmission</h2>
<mat-dialog-content>
  <div *ngIf="isView">
    <h3>Selected transmission as JSON:<br></h3>
    <pre>{{ this.jsonCountryObject }}</pre>
  </div>

  <form *ngIf="!isView" [formGroup]="form">
    <mat-list class="form-list">
      <mat-list-item>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Type</mat-label>
          <input formControlName="type" matInput type="input" required/>
          <mat-error *ngIf="form.get('type')?.hasError('required')">Type is required.</mat-error>
        </mat-form-field>
      </mat-list-item>
      <mat-list-item>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Number of gears</mat-label>
          <input formControlName="gears" min="0" matInput type="number"/>
        </mat-form-field>
      </mat-list-item>
    </mat-list>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="dismiss(null)" *ngIf="!isView" mat-button>Cancel</button>
  <button (click)="submit()" *ngIf="!isView" [disabled]="!form.valid" cdkFocusInitial
          mat-button>{{ isNewOrEdit ? 'Create' : 'Edit' }}
  </button>
  <button (click)="dismiss(null)" *ngIf="isView" cdkFocusInitial mat-button>Ok</button>
</mat-dialog-actions>
