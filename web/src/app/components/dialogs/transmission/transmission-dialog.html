<h2 mat-dialog-title>Transmission</h2>
<mat-dialog-content>
  <div *ngIf="isView">
    <h3>Selected transmission as JSON:<br></h3>
    <pre>{{ this.jsonCurrentObject }}</pre>
  </div>

  <form *ngIf="!isView" [formGroup]="form">
    <mat-list class="form-list">
      <mat-list-item>
        <mat-form-field appearance="fill" >
          <mat-label>Type</mat-label>
          <input (keyup.enter)="submit()" cdkFocusInitial formControlName="type" matInput required type="input"/>
          <mat-error *ngIf="form.get('type')?.errors?.['required']">Transmission type is required.</mat-error>
        </mat-form-field>
      </mat-list-item>
      <mat-list-item>
        <mat-form-field appearance="fill" >
          <mat-label>Number of gears</mat-label>
          <input (keyup.enter)="submit()" formControlName="gears" matInput min="0" type="number"/>
        </mat-form-field>
      </mat-list-item>
    </mat-list>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="dismiss(null)" *ngIf="!isView" mat-button>Cancel</button>
  <button (click)="submit()" *ngIf="!isView" [disabled]="!form.valid"
          mat-button>{{ isNewOrEdit ? 'Create' : 'Edit' }}
  </button>
  <button (click)="dismiss(null)" *ngIf="isView" mat-button>Ok</button>
</mat-dialog-actions>
