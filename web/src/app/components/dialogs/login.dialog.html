<h2 mat-dialog-title>Login</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-grid-list cols="1" rowHeight="3.5:1">
      <mat-grid-tile>
        <mat-form-field appearance="fill">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" required/>
        </mat-form-field>
      </mat-grid-tile>

      <mat-grid-tile>
        <mat-form-field appearance="fill">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" required/>
        </mat-form-field>
      </mat-grid-tile>

    </mat-grid-list>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="dismiss()">Cancel</button>
  <button mat-button (click)="submit()" cdkFocusInitial>Login</button>
</mat-dialog-actions>
