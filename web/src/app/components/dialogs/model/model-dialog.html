<h2 mat-dialog-title>Model</h2>
<mat-dialog-content>
  <div *ngIf="isView">
    <h3>Selected model as JSON:<br></h3>
    <pre>{{ this.jsonCurrentObject }}</pre>
  </div>

  <form *ngIf="!isView" [formGroup]="form">
    <mat-list class="form-list">
      <mat-list-item>
        <mat-form-field appearance="fill">
          <mat-label>Name</mat-label>
          <input (keyup.enter)="submit()" cdkFocusInitial formControlName="name" matInput required type="input"/>
          <mat-error *ngIf="form.get('name')?.errors?.['required']">Model name is required.</mat-error>
        </mat-form-field>
      </mat-list-item>

      <mat-list-item>
        <mat-form-field>
          <mat-label>Manufacturers country</mat-label>
          <mat-select formControlName="manufacture">
            @for (manufacture of manufacturers; track manufacture) {
              <mat-option [value]="manufacture.id">{{ manufacture.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </mat-list-item>
    </mat-list>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="dismiss(null)" *ngIf="!isView" mat-button>Cancel</button>
  <button (click)="submit()" *ngIf="!isView" [disabled]="!form.valid"
          mat-button>{{ isNewOrEdit ? 'Create' : 'Edit' }}
  </button>
  <button (click)="dismiss(null)" *ngIf="isView" mat-button>Ok</button>
</mat-dialog-actions>
