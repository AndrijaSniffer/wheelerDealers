<mat-dialog-content>
  <div *ngIf="mode == 'view' || mode == 'delete'">
    <mat-list>
      <mat-list-item>Engine id: {{engine.id_engine}}</mat-list-item>
      <mat-list-item>Engine code: {{engine.engine_code}}</mat-list-item>
      <mat-list-item>Horsepower: {{engine.horsepower}}</mat-list-item>
      <mat-list-item>Kilowatt: {{engine.kilowatt}}</mat-list-item>
      <mat-list-item>Volume: {{engine.volume}}</mat-list-item>
      <mat-list-item>Engine type id: {{engine.id_engine_type}}</mat-list-item>
    </mat-list>
  </div>

  <div *ngIf="mode == 'edit'">
    <form class="column" [formGroup]="editForm">
      <mat-form-field color="accent" appearance="outline">
        <mat-label>Edit engine code</mat-label>
        <input matInput placeholder="{{engine.engine_code}}..." formControlName="engineCode">
      </mat-form-field>
      <mat-form-field color="accent" appearance="outline">
        <mat-label>Edit horsepower</mat-label>
        <input matInput type="number" placeholder="{{engine.horsepower}}..." formControlName="horsepower">
      </mat-form-field>
      <mat-form-field color="accent" appearance="outline">
        <mat-label>Edit kilowatt</mat-label>
        <input matInput type="number" placeholder="{{engine.kilowatt}}..." formControlName="kilowatt">
      </mat-form-field>
      <mat-form-field color="accent" appearance="outline">
        <mat-label>Edit engine volume</mat-label>
        <input matInput type="number" placeholder="{{engine.volume}}..." formControlName="volume">
      </mat-form-field>
      <mat-form-field color="accent" appearance="outline">
        <mat-label>Edit engine type</mat-label>
        <input matInput type="number" placeholder="{{engine.id_engine_type}}..." formControlName="idEngineType">
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>

<mat-divider></mat-divider>

<mat-dialog-actions>
  <button mat-raised-button color="accent" (click)="onConfirmClick()" tabindex="1">{{confirmButtonText}}</button>
  <button mat-raised-button mat-dialog-close tabindex="-1">{{cancelButtonText}}</button>
</mat-dialog-actions>
