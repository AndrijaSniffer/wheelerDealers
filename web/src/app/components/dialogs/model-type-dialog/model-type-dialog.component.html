<mat-dialog-content>
  <div *ngIf="mode == 'view' || mode == 'delete'">
    <mat-list>
      <mat-list-item>Manufacturer id: {{modelType.id_model_type}}</mat-list-item>
      <mat-list-item>Name: {{modelType.type_name}}</mat-list-item>
    </mat-list>
  </div>

  <div *ngIf="mode == 'edit'">
    <form class="column" [formGroup]="editForm">
      <mat-form-field color="accent" appearance="outline">
        <mat-label>Model type</mat-label>
        <input matInput placeholder="Name..." formControlName="typeName">
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>

<mat-divider></mat-divider>

<mat-dialog-actions>
  <button mat-raised-button color="accent" (click)="onConfirmClick()" tabindex="1">{{confirmButtonText}}</button>
  <button mat-raised-button mat-dialog-close tabindex="-1">{{cancelButtonText}}</button>
</mat-dialog-actions>
