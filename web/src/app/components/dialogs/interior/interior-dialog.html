<h2 mat-dialog-title>Interior</h2>
<mat-dialog-content>
  <div *ngIf="isView">
    <h3>Selected interior as JSON:<br></h3>
    <pre>{{ this.jsonCurrentObject }}</pre>
  </div>

  <form *ngIf="!isView" [formGroup]="form">
    <mat-list class="form-list">
      <mat-list-item>
        <mat-form-field appearance="fill" >
          <mat-label>Number of doors</mat-label>
          <input (keyup.enter)="submit()" cdkFocusInitial formControlName="doors" matInput max="5" min="3" required
                 type="number"/>
          <mat-error *ngIf="form.get('doors')?.errors?.['required']">Number of doors are required.</mat-error>
        </mat-form-field>
      </mat-list-item>

      <mat-list-item>
        <mat-form-field appearance="fill" >
          <mat-label>Number of seats</mat-label>
          <input (keyup.enter)="submit()" formControlName="seats" matInput max="20" min="1" required type="number"/>
          <mat-error *ngIf="form.get('seats')?.errors?.['required']">Number of seats is required.</mat-error>
        </mat-form-field>
      </mat-list-item>

      <mat-list-item>
        <p>
          <mat-checkbox formControlName="steeringWheelLeft">Is the steering wheel on the left side?</mat-checkbox>
        </p>
      </mat-list-item>

      <mat-list-item>
        <mat-form-field appearance="fill" >
          <mat-label>Interior color</mat-label>
          <input (keyup.enter)="submit()" formControlName="color" matInput type="input"/>
        </mat-form-field>
      </mat-list-item>
    </mat-list>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="dismiss(null)" *ngIf="!isView" mat-button>Cancel</button>
  <button (click)="submit()" *ngIf="!isView" [disabled]="!form.valid" mat-button>{{ isNewOrEdit ? 'Create' : 'Edit' }}
  </button>
  <button (click)="dismiss(null)" *ngIf="isView" mat-button>Ok</button>
</mat-dialog-actions>
