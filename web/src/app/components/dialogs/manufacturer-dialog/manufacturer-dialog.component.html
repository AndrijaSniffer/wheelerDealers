<mat-dialog-content>
  <div *ngIf="mode == 'view' || mode == 'delete'">
    <mat-list>
      <mat-list-item>Manufacturer id: {{manufacturer.id}}</mat-list-item>
      <mat-list-item>Name: {{manufacturer.nameManufacturer}}</mat-list-item>
      <mat-list-item>Country id: {{manufacturer.idCountry}}</mat-list-item>
      <!--      <mat-list-item>Left side steering wheel: {{manufacturer.left_side_steering_wheel ? 'Yes' : 'No'}}</mat-list-item>-->
      <!--      <mat-list-item>Color: {{manufacturer.color ?? 'N/A'}}</mat-list-item>-->
    </mat-list>
  </div>

  <div *ngIf="mode == 'edit'">
    <form class="column" [formGroup]="editForm">
      <mat-form-field color="accent" appearance="outline">
        <mat-label>Manufacturer name</mat-label>
        <input matInput placeholder="Name..." formControlName="nameManufacturer">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Engine type</mat-label>
        <select matNativeControl formControlName="countryId">
          <option *ngFor="let country of dataCountries" value="{{country.id}}">{{country.nameCountry}}</option>
        </select>
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>

<mat-divider></mat-divider>

<mat-dialog-actions>
  <button mat-raised-button color="accent" (click)="onConfirmClick()" tabindex="1">{{confirmButtonText}}</button>
  <button mat-raised-button mat-dialog-close tabindex="-1">{{cancelButtonText}}</button>
</mat-dialog-actions>
