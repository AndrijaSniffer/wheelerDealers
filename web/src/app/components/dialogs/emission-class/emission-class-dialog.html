<h2 mat-dialog-title>Emission class</h2>
<mat-dialog-content>
  <div *ngIf="isView">
    <h3>Selected emission class as JSON:<br></h3>
    <pre>{{this.jsonCurrentObject}}</pre>
  </div>

  <form *ngIf="!isView" [formGroup]="form">
    <mat-list class="form-list">
      <mat-list-item>
        <mat-form-field appearance="fill" >
          <mat-label>Class name</mat-label>
          <input matInput type="input" formControlName="className" (keyup.enter)="submit()" cdkFocusInitial required/>
          <mat-error *ngIf="form.get('className')?.errors?.['required']">Class name is required.</mat-error>
        </mat-form-field>
      </mat-list-item>
    </mat-list>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="dismiss(null)" *ngIf="!isView" mat-button>Cancel</button>
  <button (click)="submit()" [disabled]="!form.valid" *ngIf="!isView" mat-button>{{isNewOrEdit ? 'Create' : 'Edit'}}</button>
  <button (click)="dismiss(null)" *ngIf="isView" mat-button>Ok</button>
</mat-dialog-actions>
