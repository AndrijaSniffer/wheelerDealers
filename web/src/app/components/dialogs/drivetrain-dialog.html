<h2 mat-dialog-title>Drivetrain</h2>
<mat-dialog-content>
  <div *ngIf="isView">
    <h3>Selected drivetrain as JSON:<br></h3>
    <pre>{{this.jsonCurrentObject}}</pre>
  </div>

  <form *ngIf="!isView" [formGroup]="form">
    <mat-list class="form-list">
      <mat-list-item>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Type</mat-label>
          <input matInput type="input" formControlName="type" required/>
          <mat-error *ngIf="form.get('type')?.hasError('required')">Type is required.</mat-error>
        </mat-form-field>
      </mat-list-item>
    </mat-list>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="dismiss(null)" *ngIf="!isView" mat-button>Cancel</button>
  <button (click)="submit()" [disabled]="!form.valid" *ngIf="!isView" cdkFocusInitial mat-button>{{isNewOrEdit ? 'Create' : 'Edit'}}</button>
  <button (click)="dismiss(null)" *ngIf="isView" cdkFocusInitial mat-button>Ok</button>
</mat-dialog-actions>
