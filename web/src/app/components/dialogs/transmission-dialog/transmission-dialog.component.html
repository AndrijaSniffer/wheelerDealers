<mat-dialog-content>
  <div *ngIf="mode == 'view' || mode == 'delete'">
    <mat-list>
      <mat-list-item>Transmission id: {{transmission.id_transmission}}</mat-list-item>
      <mat-list-item>Number of gears: {{transmission.number_of_speeds}}</mat-list-item>
      <mat-list-item>Type: {{transmission.transmission_type}}</mat-list-item>
    </mat-list>
  </div>

  <div *ngIf="mode == 'edit'">
    <form class="column" [formGroup]="editForm">
      <mat-form-field color="accent" appearance="outline">
        <mat-label>Number of gears</mat-label>
        <input matInput type="number" placeholder="Name..." formControlName="numberOfSpeeds">
      </mat-form-field>

      <mat-form-field color="accent" appearance="outline">
        <mat-label>Type</mat-label>
        <input matInput placeholder="..." formControlName="transmissionType">
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>

<mat-divider></mat-divider>

<mat-dialog-actions>
  <button mat-raised-button color="accent" (click)="onConfirmClick()" tabindex="1">{{confirmButtonText}}</button>
  <button mat-raised-button mat-dialog-close tabindex="-1">{{cancelButtonText}}</button>
</mat-dialog-actions>
