<mat-dialog-content>
  <div *ngIf="mode == 'view' || mode == 'delete'">
    <mat-list>
      <mat-list-item>Fuel id: {{fuel.id}}</mat-list-item>
      <mat-list-item>Name: {{fuel.fuelName}}</mat-list-item>
      <mat-list-item>Kilometers per litre: {{fuel.kml}}</mat-list-item>
    </mat-list>
  </div>

  <div *ngIf="mode == 'edit'">
    <form class="column" [formGroup]="editForm">
      <mat-form-field color="accent" appearance="outline">
        <mat-label>Edit fuel name</mat-label>
        <input matInput placeholder="{{fuel.fuelName}}..." formControlName="fuelName">
      </mat-form-field>

      <mat-form-field color="accent" appearance="outline">
        <mat-label>Edit kilometers per litre</mat-label>
        <input matInput placeholder="{{fuel.kml}}..." formControlName="kml">
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>

<mat-divider></mat-divider>

<mat-dialog-actions>
  <button mat-raised-button color="accent" (click)="onConfirmClick()" tabindex="1">{{confirmButtonText}}</button>
  <button mat-raised-button mat-dialog-close tabindex="-1">{{cancelButtonText}}</button>
</mat-dialog-actions>
