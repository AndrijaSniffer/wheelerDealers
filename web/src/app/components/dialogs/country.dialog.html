<h2 mat-dialog-title>Country</h2>
<mat-dialog-content>
    <div *ngIf="isView">
        <h3>Current country as JSON:<br></h3>
        <pre>{{this.jsonCountryObject}}</pre>
    </div>

    <form *ngIf="!isView" [formGroup]="form">
        <mat-list class="form-list">
            <mat-list-item>
              <mat-form-field appearance="fill" class="full-width">
                <mat-label>Username</mat-label>
                <input matInput type="input" formControlName="name" required/>
                <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required.</mat-error>
              </mat-form-field>
            </mat-list-item>
        </mat-list>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button (click)="dismiss(null)" *ngIf="!isView" mat-button>Cancel</button>
    <button (click)="submit()" [disabled]="!form.valid" *ngIf="!isView" cdkFocusInitial mat-button>{{isNewOrEdit ? 'Create' : 'Edit'}}</button>
    <button (click)="dismiss(null)" *ngIf="isView" cdkFocusInitial mat-button>Ok</button>
</mat-dialog-actions>
