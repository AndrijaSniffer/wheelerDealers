<h2 mat-dialog-title>Login</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-grid-list cols="1" rowHeight="3.5:1">
      <mat-grid-tile>
        <mat-form-field appearance="fill">
          <mat-label>Username</mat-label>
          <input (keyup.enter)="submit()" formControlName="username" matInput required/>
        </mat-form-field>
      </mat-grid-tile>

      <mat-grid-tile>
        <mat-form-field appearance="fill">
          <mat-label>Password</mat-label>
          <input (keyup.enter)="submit()" formControlName="password" matInput required type="password"/>
        </mat-form-field>
      </mat-grid-tile>

    </mat-grid-list>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="dismiss()" mat-button>Cancel</button>
  <button (click)="submit()" cdkFocusInitial mat-button>Login</button>
</mat-dialog-actions>
