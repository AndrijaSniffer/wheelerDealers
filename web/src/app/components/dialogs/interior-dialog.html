<h2 mat-dialog-title>Interior</h2>
<mat-dialog-content>
  <div *ngIf="isView">
    <h3>Selected interior as JSON:<br></h3>
    <pre>{{this.jsonCurrentObject}}</pre>
  </div>

  <form *ngIf="!isView" [formGroup]="form">
    <mat-list class="form-list">
      <mat-list-item>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Number of doors</mat-label>
          <input matInput type="number" min="3" max="5" formControlName="doors" required/>
          <mat-error *ngIf="form.get('doors')?.hasError('required')">Number of doors are required.</mat-error>
        </mat-form-field>
      </mat-list-item>

      <mat-list-item>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Number of seats</mat-label>
          <input matInput type="number" min="1" max="20" formControlName="seats" required/>
          <mat-error *ngIf="form.get('seats')?.hasError('required')">Number of seats is required.</mat-error>
        </mat-form-field>
      </mat-list-item>

      <mat-list-item>
        <p><mat-checkbox formControlName="steeringWheelLeft">Is the steering wheel on the left side?</mat-checkbox></p>
      </mat-list-item>

      <mat-list-item>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Interior color</mat-label>
          <input matInput type="input" formControlName="color"/>
        </mat-form-field>
      </mat-list-item>
    </mat-list>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="dismiss(null)" *ngIf="!isView" mat-button>Cancel</button>
  <button (click)="submit()" [disabled]="!form.valid" *ngIf="!isView" cdkFocusInitial mat-button>{{isNewOrEdit ? 'Create' : 'Edit'}}</button>
  <button (click)="dismiss(null)" *ngIf="isView" cdkFocusInitial mat-button>Ok</button>
</mat-dialog-actions>
