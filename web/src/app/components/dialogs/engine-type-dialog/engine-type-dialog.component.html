<mat-dialog-content>
  <div *ngIf="mode == 'view' || mode == 'delete'">
    <mat-list>
      <mat-list-item>Engine type id: {{engineType.id}}</mat-list-item>
      <mat-list-item>Engine type: {{engineType.engineType}}</mat-list-item>
    </mat-list>
  </div>

  <div *ngIf="mode == 'edit'">
    <form class="column" [formGroup]="editForm">
      <mat-form-field color="accent" appearance="outline">
        <mat-label>Edit engine type</mat-label>
        <input matInput placeholder="{{engineType.engineType}}..." formControlName="engineType">
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>

<mat-divider></mat-divider>

<mat-dialog-actions>
  <button mat-raised-button color="accent" (click)="onConfirmClick()" tabindex="1">{{confirmButtonText}}</button>
  <button mat-raised-button mat-dialog-close tabindex="-1">{{cancelButtonText}}</button>
</mat-dialog-actions>
