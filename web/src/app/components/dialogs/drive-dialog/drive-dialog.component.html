<mat-dialog-content>
  <div *ngIf="mode == 'view' || mode == 'delete'">
    <mat-list>
      <mat-list-item>Drive id: {{drive.id_drive}}</mat-list-item>
      <mat-list-item>Drive type: {{drive.drive_type}}</mat-list-item>
    </mat-list>
  </div>

  <div *ngIf="mode == 'edit'">
    <form class="column" [formGroup]="editForm">
      <mat-form-field color="accent" appearance="outline">
        <mat-label>Edit drive type</mat-label>
        <input matInput placeholder="{{drive.drive_type}}..." formControlName="driveType">
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>

<mat-divider></mat-divider>

<mat-dialog-actions>
  <button mat-raised-button color="accent" (click)="onConfirmClick()" tabindex="1">{{confirmButtonText}}</button>
  <button mat-raised-button mat-dialog-close tabindex="-1">{{cancelButtonText}}</button>
</mat-dialog-actions>
