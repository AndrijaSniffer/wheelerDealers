<h2 mat-dialog-title>Manufacturer</h2>
<mat-dialog-content>
  <div *ngIf="isView">
    <h3>Selected model type as JSON:<br></h3>
    <pre>{{this.jsonCurrentObject}}</pre>
  </div>

  <form *ngIf="!isView" [formGroup]="form">
    <mat-list class="form-list">
      <mat-list-item>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Name</mat-label>
          <input matInput type="input" formControlName="name" required/>
          <mat-error *ngIf="form.get('name')?.hasError('required')">Manufacturer name is required.</mat-error>
        </mat-form-field>
      </mat-list-item>
      <mat-list-item>
        <mat-form-field>
          <mat-label>Manufacturers country</mat-label>
          <mat-select formControlName="country">
            @for (country of countries; track country) {
              <mat-option [value]="country.id">{{country.name}}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </mat-list-item>
    </mat-list>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="dismiss(null)" *ngIf="!isView" mat-button>Cancel</button>
  <button (click)="submit()" [disabled]="!form.valid" *ngIf="!isView" cdkFocusInitial mat-button>{{isNewOrEdit ? 'Create' : 'Edit'}}</button>
  <button (click)="dismiss(null)" *ngIf="isView" cdkFocusInitial mat-button>Ok</button>
</mat-dialog-actions>
