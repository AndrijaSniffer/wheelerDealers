<div class="main-container">
  <mat-list>
    <mat-list-item>
      <button mat-button (click)="new()">
        <mat-icon>add</mat-icon>
        Add new
      </button>
    </mat-list-item>
    <mat-list-item class="table-list-item">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let modelType"> {{modelType.id}} </td>
        </ng-container>
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef> Type </th>
          <td mat-cell *matCellDef="let modelType"> {{modelType.type}} </td>
        </ng-container>
        <ng-container matColumnDef="options">
          <th mat-header-cell *matHeaderCellDef> Options </th>
          <td mat-cell *matCellDef="let modelType">
            <button mat-mini-fab (click)="view(modelType.id)" class="option-btn"><mat-icon>visibility</mat-icon></button>
            <button mat-mini-fab (click)="edit(modelType.id)" class="option-btn"><mat-icon>edit</mat-icon></button>
            <button mat-mini-fab (click)="delete(modelType.id)" class="option-btn"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-list-item>
  </mat-list>
</div>
