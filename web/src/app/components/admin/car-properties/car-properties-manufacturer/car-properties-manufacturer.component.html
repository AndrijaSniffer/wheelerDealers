<mat-expansion-panel hideToggle>
  <mat-expansion-panel-header>
    <mat-panel-title>
      Form
    </mat-panel-title>
    <mat-panel-description>
      Add a new manufacturer
    </mat-panel-description>
  </mat-expansion-panel-header>

  <form class="column" (ngSubmit)="submitForm()" [formGroup]="form">
    <mat-form-field color="accent" appearance="outline">
      <mat-label>Manufacturer name</mat-label>
      <input matInput placeholder="Name..." formControlName="nameManufacturer">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Engine type</mat-label>
      <select matNativeControl formControlName="countryId">
        <option *ngFor="let country of dataCountries" value="{{country.id_country}}">{{country.name_country}}</option>
      </select>
    </mat-form-field>
    <br>
    <button mat-flat-button color="accent" type="submit" [disabled]="form.invalid">Add new</button>
  </form>

</mat-expansion-panel>

<mat-expansion-panel hideToggle>
  <mat-expansion-panel-header>
    <mat-panel-title>
      Table
    </mat-panel-title>
    <mat-panel-description>
      Table containing all manufacturers with manipulation options
    </mat-panel-description>
  </mat-expansion-panel-header>

  <table mat-table [dataSource]="data" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let element"> {{ element.id_manufacturer }} </td>
    </ng-container>

    <ng-container matColumnDef="nameManufacturer">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element"> {{ element.name_manufacturer }} </td>
    </ng-container>

    <ng-container matColumnDef="countryName">
      <th mat-header-cell *matHeaderCellDef>Country</th>
      <td mat-cell *matCellDef="let element"> {{ element.id_country.name_country }} </td>
    </ng-container>

    <ng-container matColumnDef="options">
      <th mat-header-cell *matHeaderCellDef>Options</th>
      <td mat-cell *matCellDef="let element">
        <button class="option-btn" (click)="openDialog('view', element.id_manufacturer)">
          <mat-icon color="accent">visibility</mat-icon>
        </button>
        <button class="option-btn" (click)="openDialog('edit', element.id_manufacturer)">
          <mat-icon color="accent">edit</mat-icon>
        </button>
        <button class="option-btn" (click)="openDialog('delete', element.id_manufacturer)">
          <mat-icon color="accent">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

</mat-expansion-panel>
