<div>
  <mat-tab-group>
    <mat-tab label="Countries">

      <mat-expansion-panel hideToggle>
        <mat-expansion-panel-header>
          <mat-panel-title>
            Form
          </mat-panel-title>
          <mat-panel-description>
            Add a new country
          </mat-panel-description>
        </mat-expansion-panel-header>

        <form class="column" (ngSubmit)="submitCreateForm()" [formGroup]="createForm">
          <mat-form-field color="accent" appearance="outline">
            <mat-label>Edit country name</mat-label>
            <input matInput placeholder="Name..." formControlName="countryName">
          </mat-form-field>
          <br>
          <button mat-flat-button color="accent" type="submit" [disabled]="createForm.invalid">Add new</button>
        </form>

      </mat-expansion-panel>

      <!--#region Country table -->
      <mat-expansion-panel hideToggle>
        <mat-expansion-panel-header>
          <mat-panel-title>
            Table
          </mat-panel-title>
          <mat-panel-description>
            Table containing all countries with manipulation options
          </mat-panel-description>
        </mat-expansion-panel-header>

        <table mat-table [dataSource]="countriesData" class="mat-elevation-z8">

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let element"> {{ element.id }} </td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element"> {{ element.nameCountry }} </td>
          </ng-container>

          <ng-container matColumnDef="options">
            <th mat-header-cell *matHeaderCellDef>Options</th>
            <td mat-cell *matCellDef="let element">
              <button class="option-btn" (click)="openCountryDialog('view', element.id)">
                <mat-icon color="accent">visibility</mat-icon>
              </button>
              <button class="option-btn" (click)="openCountryDialog('edit', element.id)">
                <mat-icon color="accent">edit</mat-icon>
              </button>
              <button class="option-btn" (click)="openCountryDialog('delete', element.id)">
                <mat-icon color="accent">delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-expansion-panel>
      <!--#endregion-->
    </mat-tab>

    <mat-tab label="Images">
      <!--TO DO-->
    </mat-tab>
  </mat-tab-group>
</div>
