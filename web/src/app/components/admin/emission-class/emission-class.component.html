<div class="main-container">
  <mat-list>
    <mat-list-item>
      <button (click)="new()" mat-button>
        <mat-icon>add</mat-icon>
        Add new
      </button>
    </mat-list-item>
    <mat-list-item class="table-list-item">
      <table [dataSource]="dataSource" mat-table>
        <ng-container matColumnDef="id">
          <th *matHeaderCellDef mat-header-cell> ID</th>
          <td *matCellDef="let emissionClass" mat-cell> {{ emissionClass.id }}</td>
        </ng-container>
        <ng-container matColumnDef="className">
          <th *matHeaderCellDef mat-header-cell> Class name</th>
          <td *matCellDef="let emissionClass" mat-cell> {{ emissionClass.className }}</td>
        </ng-container>
        <ng-container matColumnDef="options">
          <th *matHeaderCellDef mat-header-cell> Options</th>
          <td *matCellDef="let emissionClass" mat-cell>
            <button (click)="view(emissionClass.id)" class="option-btn" mat-mini-fab>
              <mat-icon>visibility</mat-icon>
            </button>
            <button (click)="edit(emissionClass.id)" class="option-btn" mat-mini-fab>
              <mat-icon>edit</mat-icon>
            </button>
            <button (click)="delete(emissionClass.id)" class="option-btn" mat-mini-fab>
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
        <tr *matRowDef="let row; columns: displayedColumns;" mat-row></tr>
      </table>
    </mat-list-item>
  </mat-list>
</div>
