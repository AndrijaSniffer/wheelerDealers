<mat-tab-group>
  <mat-tab label="Drive">

    <mat-expansion-panel hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>
          Form
        </mat-panel-title>
        <mat-panel-description>
          Add a new drive system
        </mat-panel-description>
      </mat-expansion-panel-header>

      <form class="column" (ngSubmit)="submitDriveForm()" [formGroup]="driveForm">
        <mat-form-field color="accent" appearance="outline">
          <mat-label>Drive type</mat-label>
          <input matInput placeholder="Drive type..." formControlName="driveType">
        </mat-form-field>
        <br>
        <button mat-flat-button color="accent" type="submit" [disabled]="driveForm.invalid">Add new</button>
      </form>

    </mat-expansion-panel>

    <mat-expansion-panel hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>
          Table
        </mat-panel-title>
        <mat-panel-description>
          Table containing all drive systems with manipulation options
        </mat-panel-description>
      </mat-expansion-panel-header>

      <table mat-table [dataSource]="driveData" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let element"> {{ element.id_drive }} </td>
        </ng-container>

        <ng-container matColumnDef="driveType">
          <th mat-header-cell *matHeaderCellDef>Drive type</th>
          <td mat-cell *matCellDef="let element"> {{ element.drive_type }} </td>
        </ng-container>

        <ng-container matColumnDef="options">
          <th mat-header-cell *matHeaderCellDef>Options</th>
          <td mat-cell *matCellDef="let element">
            <button class="option-btn" (click)="openDrivesDialog('view', element.id_drive)">
              <mat-icon color="accent">visibility</mat-icon>
            </button>
            <button class="option-btn" (click)="openDrivesDialog('edit', element.id_drive)">
              <mat-icon color="accent">edit</mat-icon>
            </button>
            <button class="option-btn" (click)="openDrivesDialog('delete', element.id_drive)">
              <mat-icon color="accent">delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedDriveColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedDriveColumns;"></tr>
      </table>

    </mat-expansion-panel>

  </mat-tab>

  <mat-tab label="Engine type">

  </mat-tab>

  <mat-tab label="Engine">

  </mat-tab>

  <mat-tab label="Fuel">

  </mat-tab>

  <mat-tab label="Interior">

  </mat-tab>

  <mat-tab label="Transmission">

  </mat-tab>
</mat-tab-group>
