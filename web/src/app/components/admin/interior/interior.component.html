<div class="main-container">
  <mat-list>
    <mat-list-item>
      <button (click)="new()" mat-button>
        <mat-icon>add</mat-icon>
        Add new
      </button>
    </mat-list-item>
    <mat-list-item class="table-list-item">
      <table [dataSource]="dataSource" mat-table>
        <ng-container matColumnDef="id">
          <th *matHeaderCellDef mat-header-cell> ID</th>
          <td *matCellDef="let interior" mat-cell> {{ interior.id }}</td>
        </ng-container>
        <ng-container matColumnDef="doors">
          <th *matHeaderCellDef mat-header-cell> Number of doors</th>
          <td *matCellDef="let interior" mat-cell> {{ interior.doors }}</td>
        </ng-container>
        <ng-container matColumnDef="seats">
          <th *matHeaderCellDef mat-header-cell> Number of seats</th>
          <td *matCellDef="let interior" mat-cell> {{ interior.seats }}</td>
        </ng-container>
        <ng-container matColumnDef="steeringWheelLeft">
          <th *matHeaderCellDef mat-header-cell> Is steering wheel on the left side</th>
          <td *matCellDef="let interior" mat-cell> {{ interior.steeringWheelLeft ? 'Yes' : 'No' }}</td>
        </ng-container>
        <ng-container matColumnDef="color">
          <th *matHeaderCellDef mat-header-cell> Interior color</th>
          <td *matCellDef="let interior" mat-cell> {{ interior.color ? interior.color : 'N/A' }}</td>
        </ng-container>
        <ng-container matColumnDef="options">
          <th *matHeaderCellDef mat-header-cell> Options</th>
          <td *matCellDef="let interior" mat-cell>
            <button (click)="view(interior.id)" class="option-btn" mat-mini-fab>
              <mat-icon>visibility</mat-icon>
            </button>
            <button (click)="edit(interior.id)" class="option-btn" mat-mini-fab>
              <mat-icon>edit</mat-icon>
            </button>
            <button (click)="delete(interior.id)" class="option-btn" mat-mini-fab>
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
        <tr *matRowDef="let row; columns: displayedColumns;" mat-row></tr>
      </table>
    </mat-list-item>
  </mat-list>
</div>
