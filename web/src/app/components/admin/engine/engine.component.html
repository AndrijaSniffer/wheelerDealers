<div class="main-container">
  <mat-list>
    <mat-list-item>
      <button (click)="new()" mat-button>
        <mat-icon>add</mat-icon>
        Add new
      </button>
    </mat-list-item>
    <mat-list-item class="table-list-item">
      <table [dataSource]="dataSource" mat-table>
        <ng-container matColumnDef="id">
          <th *matHeaderCellDef mat-header-cell> ID</th>
          <td *matCellDef="let engine" mat-cell> {{ engine.id }}</td>
        </ng-container>
        <ng-container matColumnDef="engineType">
          <th *matHeaderCellDef mat-header-cell> Engine type</th>
          <td *matCellDef="let engine" mat-cell> {{ engine.engineType.type }}</td>
        </ng-container>
        <ng-container matColumnDef="emissionClass">
          <th *matHeaderCellDef mat-header-cell> Emission class</th>
          <td *matCellDef="let engine" mat-cell> {{ engine.emissionClass.className }}</td>
        </ng-container>
        <ng-container matColumnDef="engineCode">
          <th *matHeaderCellDef mat-header-cell> Code</th>
          <td *matCellDef="let engine" mat-cell> {{ engine.engineCode }}</td>
        </ng-container>
        <ng-container matColumnDef="horsepower">
          <th *matHeaderCellDef mat-header-cell> Horsepower</th>
          <td *matCellDef="let engine" mat-cell> {{ engine.horsepower ? engine.horsepower : 'N/A' }}</td>
        </ng-container>
        <ng-container matColumnDef="kilowatt">
          <th *matHeaderCellDef mat-header-cell> Kilowatt</th>
          <td *matCellDef="let engine" mat-cell> {{ engine.kilowatt ? engine.kilowatt : 'N/A' }}</td>
        </ng-container>
        <ng-container matColumnDef="volume">
          <th *matHeaderCellDef mat-header-cell> Volume</th>
          <td *matCellDef="let engine" mat-cell> {{ engine.volume }}</td>
        </ng-container>
        <ng-container matColumnDef="options">
          <th *matHeaderCellDef mat-header-cell> Options</th>
          <td *matCellDef="let engine" mat-cell>
            <button (click)="view(engine.id)" class="option-btn" mat-mini-fab>
              <mat-icon>visibility</mat-icon>
            </button>
            <button (click)="edit(engine.id)" class="option-btn" mat-mini-fab>
              <mat-icon>edit</mat-icon>
            </button>
            <button (click)="delete(engine.id)" class="option-btn" mat-mini-fab>
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
        <tr *matRowDef="let row; columns: displayedColumns;" mat-row></tr>
      </table>
    </mat-list-item>
  </mat-list>
</div>
